name: Tests

on: [ push, pull_request ]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]

    name: "PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: composer update --with "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Execute tests
        run: vendor/bin/phpunit
